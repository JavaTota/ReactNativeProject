openapi: 3.1.0
info:
  title: WeTravel API
  description: Python backend with Clerk sessions and Supabase. Authorize with a session
    JWT, never a secret key.
  version: 2.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health
      description: Process health only; does not prove live Clerk/Supabase connectivity.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
