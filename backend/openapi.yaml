components:
  schemas:
    BookingStatus:
      type: string
      enum:
      - Not booked
      - Booked
      - No booking needed
      - Cancelled
      title: BookingStatus
    CommentInput:
      properties:
        body:
          type: string
          maxLength: 1000
          minLength: 1
          title: Body
      additionalProperties: false
      type: object
      required:
      - body
      title: CommentInput
    CommentResponse:
      properties:
        id:
          type: string
          title: Id
        trip_id:
          type: string
          title: Trip Id
        user_id:
          type: string
          title: User Id
        body:
          type: string
          title: Body
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - trip_id
      - user_id
      - body
      - created_at
      - updated_at
      title: CommentResponse
    ErrorResponse:
      properties:
        error:
          type: string
          title: Error
        issues:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Issues
      type: object
      required:
      - error
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JourneyInput:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
        destination:
          type: string
          maxLength: 160
          minLength: 1
          title: Destination
        startDate:
          type: string
          title: Startdate
          examples:
          - '2026-08-01'
        endDate:
          type: string
          title: Enddate
          examples:
          - '2026-08-01'
        status:
          $ref: '#/components/schemas/JourneyStatus'
          default: Planning
        stops:
          items:
            $ref: '#/components/schemas/StopInput'
          type: array
          maxItems: 1000
          title: Stops
      additionalProperties: false
      type: object
      required:
      - title
      - destination
      - startDate
      - endDate
      title: JourneyInput
    JourneyResponse:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        destination:
          type: string
          title: Destination
        startDate:
          type: string
          title: Startdate
        endDate:
          type: string
          title: Enddate
        status:
          $ref: '#/components/schemas/JourneyStatus'
        stops:
          items:
            $ref: '#/components/schemas/StopInput'
          type: array
          title: Stops
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceResponse'
          - type: 'null'
        publishedId:
          anyOf:
          - type: string
          - type: 'null'
          title: Publishedid
      type: object
      required:
      - id
      - title
      - destination
      - startDate
      - endDate
      - status
      - stops
      title: JourneyResponse
    JourneyStatus:
      type: string
      enum:
      - Planning
      - Traveling
      - Completed
      title: JourneyStatus
    MeResponse:
      properties:
        userId:
          type: string
          title: Userid
        profile:
          anyOf:
          - $ref: '#/components/schemas/ProfileResponse'
          - type: 'null'
      type: object
      required:
